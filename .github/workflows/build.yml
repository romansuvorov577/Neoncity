name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: pip install --upgrade buildozer "cython<3" virtualenv

      - name: Find project folder
        run: |
          SPEC=$(find . -name buildozer.spec -not -path "./.git/*" | head -1)
          echo "PROJECT_DIR=$(dirname "$SPEC")" >> $GITHUB_ENV

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show real error
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: grep -m1 -B100 "# Command failed" build.log || tail -n 150 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neoncity-apk
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
